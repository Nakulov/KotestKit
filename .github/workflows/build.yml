name: build
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
      - run: ./gradlew build
