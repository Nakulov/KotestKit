name: build
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - run: ./gradlew build
      - name: Smoke test on the published artifact
        run: |
          ./gradlew publishToMavenLocal
          VERSION=$(./gradlew properties -q | grep '^version:' | cut -d' ' -f2)
          ./gradlew -p smoke test -PkotestkitVersion="$VERSION"
