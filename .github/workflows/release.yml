name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - name: Read version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Tag commit is in dev
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
      - name: Tag matches the build version
        run: |
          BUILD_VERSION=$(./gradlew :properties -q | grep '^version:' | cut -d' ' -f2)
          if [ "$BUILD_VERSION" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match build version $BUILD_VERSION"
            exit 1
          fi
      - name: README names this version
        run: grep -qF "io.github.nakulov:kotestkit:$VERSION" README.md
      - name: Release notes exist
        run: test -f "release-notes/$VERSION.md"
      - run: ./gradlew build
      - name: Smoke test on the published artifact
        run: |
          ./gradlew publishToMavenLocal
          ./gradlew -p smoke test -PkotestkitVersion="$VERSION"
      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ github.token }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --notes-file "release-notes/$VERSION.md"
        env:
          GH_TOKEN: ${{ github.token }}
